  <div class="relative z-10 w-full max-w-[360px]">
    <div class="w-full rounded-[24px] bg-[#1e1e1e]/90 backdrop-blur-md border border-white/[0.06] p-7 sm:p-8 shadow-[0_16px_48px_rgba(0,0,0,0.6)]">

      <div class="flex flex-col gap-3">
        <input type="text" placeholder="電話號碼" class="w-full h-[48px] rounded-[12px] bg-white text-[#111111] placeholder:text-[#9a9a9a] px-4 text-[15px] outline-none">

    </div>
  </div>
  <script>
    let countdown=0;
    const btn=document.getElementById('btn-submit');
    btn.addEventListener('click',()=>{
      if(countdown>0) return;
      countdown=60;
      btn.disabled=true;
      const timer=setInterval(()=>{
        countdown--;
        btn.textContent=countdown>0?`${countdown}s 後可重新提交`:'測試提交';
        if(countdown<=0){clearInterval(timer);btn.disabled=false;}
      },1000);
      btn.textContent=`${countdown}s 後可重新提交`;
    });
    document.getElementById('btn-complete').addEventListener('click',()=>alert('完成測試 - 純前端Demo'));
  </script>
