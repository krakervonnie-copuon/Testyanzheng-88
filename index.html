<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>參與活動</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  </style>
</head>
<body class="min-h-screen w-full bg-[#111111] flex items-start justify-center px-4 py-16 sm:py-24">
  <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(255,255,255,0.06),transparent_60%)]"></div>
  
  <div class="relative w-full max-w-[360px]">
    <div class="w-full rounded-[24px] bg-[#1e1e1e] border border-white/[0.06] p-7 sm:p-8 shadow-[0_16px_48px_rgba(0,0,0,0.5)]">
      <!-- 標題 - 修改這裡的文字 -->
      <h1 id="page-title" class="text-[22px] font-medium tracking-[0.02em] text-white text-center mb-8">
       參與活動
      </h1>

      <div class="flex flex-col gap-3">
        <input id="nickname" type="text" placeholder="台灣電話號碼"
          class="w-full h-[48px] rounded-[12px] bg-white text-[#111111] placeholder:text-[#9a9a9a] px-4 text-[15px] outline-none border border-transparent focus:border-white/20 focus:ring-4 focus:ring-white/10 transition-all">
        
        <button id="btn-submit"
          class="w-full h-[48px] rounded-[12px] text-white text-[15px] font-medium tracking-wide transition-all duration-150 bg-[#e84a4a] hover:bg-[#e03e3e] active:bg-[#d73636] outline-none disabled:bg-[#4a4a4a] disabled:cursor-not-allowed disabled:opacity-70">
          發送驗證碼
        </button>

        <input id="note" type="text" placeholder="輸入6位數驗證碼"
          class="w-full h-[48px] rounded-[12px] bg-white text-[#111111] placeholder:text-[#9a9a9a] px-4 text-[15px] outline-none border border-transparent focus:border-white/20 focus:ring-4 focus:ring-white/10 transition-all mt-1">
        
        <button id="btn-complete"
          class="w-full h-[48px] rounded-[12px] bg-[#e84a4a] hover:bg-[#e03e3e] active:bg-[#d73636] text-white text-[15px] font-medium tracking-wide transition-colors duration-150">
         完成登記
        </button>
      </div>

      <div class="mt-8 h-px w-full bg-white/[0.06]"></div>
      <p class="mt-5 text-center text-[11.5px] leading-[1.5] text-[#8a8a8a] tracking-wide">
        驗證碼由line傳送到您的簡訊，僅提供官方人員使用，禁止外流
      </p>
    </div>
    <div class="mt-6 flex justify-center"><div class="h-1 w-1 rounded-full bg-white/20"></div></div>
  </div>

  <script>
    // 60s 倒計時邏輯
    let countdown = 0;
    let timer = null;
    const btnSubmit = document.getElementById('btn-submit');
    
    btnSubmit.addEventListener('click', () => {
      if (countdown > 0) return;
      countdown = 60;
      btnSubmit.disabled = true;
      updateButton();
      timer = setInterval(() => {
        countdown--;
        updateButton();
        if (countdown <= 0) {
          clearInterval(timer);
          btnSubmit.disabled = false;
          btnSubmit.textContent = '測試提交';
        }
      }, 1000);
    });

    function updateButton() {
      if (countdown > 0) {
        btnSubmit.textContent = `${countdown}s 後可重新提交`;
      }
    }

    document.getElementById('btn-complete').addEventListener('click', () => {
      alert('完成測試 - 純前端Demo');
    });
  </script>
</body>
</html>
